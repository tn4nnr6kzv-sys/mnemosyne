<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cabinet de lecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --ink:#141310; --panel:#1c1a14; --panel-2:#25221a; --line:#38342a; --line-2:#4a4638;
  --paper:#ece4d1; --paper-line:#cabf9f; --paper-ink:#2a2317;
  --brass:#cda54c; --brass-dim:#a5843a; --sage:#8a9a70;
  --text:#e9e3d4; --muted:#9a9280; --danger:#c46a52;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{background:var(--ink); color:var(--text); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.serif{font-family:'Spectral',Georgia,serif}
button{font-family:inherit; cursor:pointer; color:inherit}
input,select{font-family:inherit; color:inherit}
.app{display:flex; flex-direction:column; height:100vh; height:100dvh}

/* ---------- Header ---------- */
header{
  padding:16px 24px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:24px; flex-wrap:wrap;
  background:linear-gradient(180deg,#1a1812,#161410);
}
.brand h1{margin:0; font-family:'Spectral',serif; font-weight:600; font-size:24px; letter-spacing:.01em; white-space:nowrap}
.brand h1 em{color:var(--brass); font-style:italic; font-weight:500}
.insight{display:flex; gap:22px; margin-left:4px; align-items:center}
.metric{display:flex; flex-direction:column; line-height:1.15}
.metric .n{font-family:'Spectral',serif; font-size:20px; font-weight:600}
.metric .n small{font-size:12px; color:var(--muted); font-family:'Inter'}
.metric .l{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--brass-dim); font-family:'IBM Plex Mono',monospace; margin-top:2px}
.distro{display:flex; height:8px; width:150px; border-radius:5px; overflow:hidden; border:1px solid var(--line-2)}
.distro span{display:block}
.header-actions{margin-left:auto; display:flex; gap:10px; align-items:center}
.scan-btn{
  padding:11px 18px; border:none; border-radius:9px;
  background:linear-gradient(180deg,var(--brass),var(--brass-dim)); color:#20180a;
  font-weight:600; font-size:14px; display:flex; align-items:center; gap:9px;
  box-shadow:0 6px 18px -8px rgba(205,165,76,.6);
}
.scan-btn:hover{transform:translateY(-1px)}
.scan-btn svg{width:18px;height:18px}
.ghost-btn{padding:10px 14px; border:1px solid var(--line-2); border-radius:9px; background:var(--panel-2); font-size:13px; color:var(--muted)}
.ghost-btn:hover{border-color:var(--brass-dim); color:var(--brass)}
.menu{position:relative}
.menu-pop{position:absolute; right:0; top:calc(100% + 6px); background:var(--panel); border:1px solid var(--line-2); border-radius:10px; padding:6px; min-width:210px; display:none; z-index:20; box-shadow:0 20px 50px -20px #000}
.menu-pop.show{display:block}
.menu-pop button{display:block; width:100%; text-align:left; padding:10px 12px; background:none; border:none; border-radius:7px; font-size:13px; color:var(--text)}
.menu-pop button:hover{background:var(--panel-2); color:var(--brass)}
.menu-pop .sep{height:1px; background:var(--line); margin:4px 6px}

/* ---------- Toolbar ---------- */
.toolbar{
  padding:12px 24px; border-bottom:1px solid var(--line); display:flex; gap:14px;
  align-items:center; flex-wrap:wrap; background:#171510;
}
.search{position:relative}
.search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted)}
.search input{width:260px; max-width:52vw; padding:9px 12px 9px 33px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line); font-size:13px}
.search input:focus{outline:none; border-color:var(--brass-dim)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{padding:7px 13px; border-radius:20px; border:1px solid var(--line); background:transparent; font-size:12.5px; color:var(--muted); white-space:nowrap}
.chip:hover{border-color:var(--line-2); color:var(--text)}
.chip.on{background:var(--brass); border-color:var(--brass); color:#20180a; font-weight:500}
.chip .c{opacity:.7; font-family:'IBM Plex Mono',monospace; font-size:11px; margin-left:5px}
.spacer{flex:1}
.tb-select{padding:8px 11px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line); font-size:12.5px; color:var(--text)}
.tb-select:focus{outline:none; border-color:var(--brass-dim)}
.density{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.density button{padding:7px 10px; background:var(--panel-2); border:none; color:var(--muted)}
.density button.on{background:var(--brass); color:#20180a}

/* ---------- Gallery ---------- */
.gallery-wrap{flex:1; overflow-y:auto; padding:22px 24px 60px}
.gallery-wrap::-webkit-scrollbar{width:10px}
.gallery-wrap::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px}
.group-head{display:flex; align-items:baseline; gap:12px; margin:26px 2px 14px}
.group-head:first-child{margin-top:0}
.group-head h2{margin:0; font-family:'Spectral',serif; font-size:17px; font-weight:500}
.group-head .rule{flex:1; height:1px; background:var(--line)}
.group-head .n{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted)}
.gallery{display:grid; gap:20px 16px; grid-template-columns:repeat(auto-fill,minmax(var(--cw,132px),1fr))}

.book{cursor:pointer; display:flex; flex-direction:column; gap:7px}
.cover{
  position:relative; aspect-ratio:2/3; border-radius:3px; overflow:hidden;
  background:var(--panel-2);
  box-shadow:0 2px 6px rgba(0,0,0,.45), inset 3px 0 6px -3px rgba(0,0,0,.6), inset -1px 0 0 rgba(255,255,255,.04);
  transition:transform .16s ease, box-shadow .16s ease; will-change:transform;
}
.book:hover .cover{transform:translateY(-5px) scale(1.015); box-shadow:0 14px 30px -12px rgba(0,0,0,.7), 0 0 0 1px var(--brass-dim)}
.cover .spine{position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(90deg,rgba(0,0,0,.35),transparent); z-index:3}
.cover img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:2; background:var(--panel-2)}
.cover img.hide{display:none}
/* couverture typographique de secours (style paperback FR) */
.fb{position:absolute; inset:0; display:flex; flex-direction:column; padding:12px 11px; text-align:center; z-index:1}
.fb .fb-rule{height:2px; width:60%; align-self:center; margin-bottom:auto}
.fb .fb-auth{font-family:'Inter'; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; opacity:.85; margin-top:8px}
.fb .fb-title{font-family:'Spectral',serif; font-weight:600; font-size:15px; line-height:1.15; margin:8px 4px auto; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden}
.fb .fb-col{font-family:'IBM Plex Mono',monospace; font-size:8px; letter-spacing:.12em; text-transform:uppercase; padding-top:6px; border-top:1px solid; margin:auto 6px 2px; opacity:.7}
/* bandeau note + statut */
.cover .stars{position:absolute; left:0; right:0; bottom:0; z-index:4; padding:14px 8px 6px; font-size:12px; letter-spacing:1px; color:var(--brass); background:linear-gradient(0deg,rgba(12,10,7,.82),transparent); text-align:center}
.cover .reading{position:absolute; top:8px; right:-1px; z-index:4; background:var(--brass); color:#20180a; font-size:9px; font-family:'IBM Plex Mono',monospace; letter-spacing:.08em; padding:3px 8px; border-radius:3px 0 0 3px; text-transform:uppercase}
.book .cap{min-height:2.4em}
.book .cap .t{font-size:12px; line-height:1.25; color:var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.book .cap .a{font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.empty-gal{color:var(--muted); text-align:center; padding:80px 20px; font-size:14px; line-height:1.6}

/* ---------- Fiche (index card) ---------- */
.scrim{position:fixed; inset:0; background:rgba(10,9,7,.6); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:.2s; z-index:40}
.scrim.show{opacity:1; pointer-events:auto}
.fiche{
  position:fixed; top:0; right:0; height:100%; width:420px; max-width:100%;
  background:var(--paper); color:var(--paper-ink); z-index:50;
  transform:translateX(100%); transition:transform .24s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
  background-image:repeating-linear-gradient(var(--paper) 0 29px, var(--paper-line) 29px 30px);
  background-position:0 210px;
}
.fiche.show{transform:none}
.fiche-top{position:relative; padding:26px 26px 16px; border-bottom:1px solid var(--paper-line); display:flex; gap:18px}
.fiche-top .cover{width:96px; flex:none; aspect-ratio:2/3; box-shadow:0 6px 16px rgba(0,0,0,.35)}
.fiche-top .head{padding-top:4px}
.fiche-top .k{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.2em; color:#8a7a55; text-transform:uppercase}
.fiche-top h2{margin:7px 0 4px; font-family:'Spectral',serif; font-size:21px; line-height:1.15; font-weight:600}
.fiche-top .by{font-family:'Spectral',serif; font-style:italic; font-size:14px; color:#5c5138}
.fiche-close{position:absolute; top:12px; right:14px; background:none; border:none; font-size:24px; line-height:1; color:#8a7a55}
.fiche-close:hover{color:var(--paper-ink)}
.fiche-body{flex:1; overflow-y:auto; padding:16px 26px 30px}
.rate{display:flex; gap:4px; font-size:22px; color:var(--paper-line); margin:2px 0 14px}
.rate span{cursor:pointer; transition:.1s}
.rate span.on{color:var(--brass-dim)}
.rate span:hover{transform:scale(1.15)}
.frow{display:flex; font-family:'IBM Plex Mono',monospace; font-size:12.5px; line-height:2.32}
.frow .lab{width:88px; color:#8a7a55; flex:none}
.frow .val{color:var(--paper-ink)}
.freview{font-family:'Spectral',serif; font-style:italic; font-size:14px; line-height:1.55; color:#4a4132; margin:14px 0; padding-left:12px; border-left:2px solid var(--paper-line)}
.ftags{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0}
.ftag{font-family:'IBM Plex Mono',monospace; font-size:10px; padding:3px 9px; border:1px solid var(--paper-line); border-radius:20px; color:#5c5138}
.fiche-foot{padding:14px 26px; border-top:1px solid var(--paper-line); display:flex; gap:10px; align-items:center}
.fiche-foot label{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#8a7a55}
.fiche-foot select{flex:1; padding:9px; border-radius:7px; border:1px solid var(--paper-line); background:#f3ecda; color:var(--paper-ink); font-size:12.5px}
.fiche-foot .del{width:40px; height:38px; border-radius:7px; border:1px solid var(--paper-line); background:#f3ecda; color:var(--danger); font-size:16px}
.fiche-foot .del:hover{background:var(--danger); color:#fff; border-color:var(--danger)}

/* ---------- Modals ---------- */
.overlay{position:fixed; inset:0; background:rgba(10,9,7,.78); backdrop-filter:blur(6px); display:none; place-items:center; z-index:60; padding:20px}
.overlay.show{display:grid}
.sheet{width:min(440px,100%); background:var(--panel); border:1px solid var(--line-2); border-radius:16px; overflow:hidden; box-shadow:0 40px 90px -30px #000}
.sheet-head{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center}
.sheet-head h3{margin:0; font-family:'Spectral',serif; font-size:18px; font-weight:600}
.sheet-head button{background:none; border:none; font-size:22px; color:var(--muted)}
#reader{width:100%; min-height:280px; background:#000}
.sheet-note{padding:14px 20px; color:var(--muted); font-size:12.5px; line-height:1.5; text-align:center}
.sheet-note.err{color:var(--danger)}
.confirm{padding:18px 20px 20px}
.confirm .head{display:flex; gap:14px; margin-bottom:8px}
.confirm .cover{width:60px; flex:none; aspect-ratio:2/3; border-radius:3px}
.confirm .t{font-family:'Spectral',serif; font-size:17px; line-height:1.2; margin-bottom:4px}
.confirm .a{color:var(--muted); font-size:13px}
.confirm .isbn{margin-top:6px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--brass-dim)}
.confirm label{display:block; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:16px 0 6px}
.confirm select,.confirm input{width:100%; padding:11px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line); font-size:13px}
.confirm .acts{display:flex; gap:10px; margin-top:18px}
.confirm .acts button{flex:1; padding:12px; border-radius:9px; font-size:14px; border:1px solid var(--line-2); background:var(--panel-2)}
.confirm .acts .ok{background:linear-gradient(180deg,var(--brass),var(--brass-dim)); color:#20180a; border:none; font-weight:600}
.confirm .acts .ok:disabled{opacity:.5}
.spinner{display:inline-block; width:15px; height:15px; border:2px solid rgba(205,165,76,.3); border-top-color:var(--brass); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed; bottom:24px; left:50%; transform:translate(-50%,20px); opacity:0; background:var(--panel-2); border:1px solid var(--brass-dim); padding:12px 20px; border-radius:10px; font-size:13px; z-index:80; transition:.25s; box-shadow:0 12px 30px -12px #000}
.toast.show{transform:translate(-50%,0); opacity:1}

@media (max-width:720px){
  header{gap:14px} .insight{display:none} .fiche{width:100%}
  .brand h1{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1 class="serif">Cabinet de <em>lecture</em></h1></div>
    <div class="insight" id="insight"></div>
    <div class="header-actions">
      <button class="scan-btn" id="openScan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M3 12h18"/></svg>
        Ajouter un livre
      </button>
      <div class="menu">
        <button class="ghost-btn" id="menuBtn">Fichier ▾</button>
        <div class="menu-pop" id="menuPop">
          <button id="importBtn">Importer (.json / .csv Goodreads)</button>
          <div class="sep"></div>
          <button id="exportJson">Exporter en .json</button>
          <button id="exportCsv">Exporter en .csv Goodreads</button>
          <div class="sep"></div>
          <button id="resetSeed">Recharger la bibliothèque d'exemple</button>
          <input type="file" id="importFile" accept=".json,.csv,application/json,text/csv" hidden>
        </div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" placeholder="Titre, auteur…" autocomplete="off">
    </div>
    <div class="chips" id="rayonChips"></div>
    <div class="chips" id="tagChips"></div>
    <div class="spacer"></div>
    <select class="tb-select" id="noteFilter">
      <option value="0">Toutes notes</option>
      <option value="5">★★★★★</option>
      <option value="4">★★★★ et +</option>
      <option value="3">★★★ et +</option>
    </select>
    <select class="tb-select" id="sortBy">
      <option value="added">Récemment ajoutés</option>
      <option value="title">Titre A→Z</option>
      <option value="author">Auteur A→Z</option>
      <option value="year">Année ↓</option>
      <option value="rating">Note ↓</option>
    </select>
    <div class="density" id="density">
      <button data-cw="104" title="Vignettes serrées"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="2" width="6" height="6"/><rect x="9" y="2" width="6" height="6"/><rect x="16" y="2" width="6" height="6"/><rect x="2" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/><rect x="16" y="9" width="6" height="6"/></svg></button>
      <button data-cw="132" class="on" title="Vignettes moyennes"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="2" width="9" height="9"/><rect x="13" y="2" width="9" height="9"/><rect x="2" y="13" width="9" height="9"/><rect x="13" y="13" width="9" height="9"/></svg></button>
      <button data-cw="172" title="Grandes vignettes"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="2" width="20" height="9"/><rect x="2" y="13" width="20" height="9"/></svg></button>
    </div>
  </div>

  <div class="gallery-wrap"><div id="gallery"></div></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="fiche" id="fiche"></aside>

<div class="overlay" id="scanOverlay">
  <div class="sheet">
    <div class="sheet-head"><h3 class="serif">Présenter le code-barres</h3><button id="closeScan">×</button></div>
    <div id="reader"></div>
    <div class="sheet-note" id="scanNote">Autorisez la caméra, puis cadrez le code-barres.</div>
  </div>
</div>
<div class="overlay" id="confirmOverlay">
  <div class="sheet">
    <div class="sheet-head"><h3 class="serif">Ajouter au catalogue</h3><button id="closeConfirm">×</button></div>
    <div class="confirm" id="confirmBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

mblance de la fin est sujette à débat, elle a au moins le mérite de révéler ce dont tout populisme regorge : la force d’attraction. Les uns adhèrent immédiatement sans réellement entrevoir ce qui se dissimule derrière le tumulte d’une élection. Les autres se révoltent presque trop tôt pour être crédibles. Mais l’éternelle majorité silencieuse — pour ne pas dire perpétuelle — glisse progressivement dans la stupeur muette quand tout dérape.<br/><br/>Si la prise de recul domine l’essentiel de la lecture, la fin subite et suffocante provoque mille et une questions, tant 1984 semble proche ; tant Nous Autres apparaît possible ; tant la dystopie prend les habits d’un réalisme imminent. <br/><br/>Une ode à l’esprit critique, seule arme irréductible pour défendre les libertés fondamentales.","shelf":"read","tags":[],"added":1559260800000},{"isbn":"9782264043153","title":"Le Dernier Homme","authors":["Margaret Atwood","Michèle Albaret-Maatsch"],"publisher":"10 X 18","year":"2007","pages":480,"cover":"https://covers.openlibrary.org/b/isbn/9782264043153-M.jpg","rating":0,"review":"","shelf":"to-read","tags":[],"added":1559260800000},{"isbn":"9782752906205","title":"Bêtes, hommes et dieux : à travers la Mongolie interdite, 1920-1921 (0000)","authors":["Ferdynand Antoni Ossendowski","Robert Renard"],"publisher":"LIBRETTO","year":"2011","pages":320,"cover":"https://covers.openlibrary.org/b/isbn/9782752906205-M.jpg","rating":4,"review":"","shelf":"read","tags":[],"added":1556668800000},{"isbn":"9782253088714","title":"Le Chancellor","authors":["Jules Verne"],"publisher":"LGF","year":"2008","pages":280,"cover":"https://covers.openlibrary.org/b/isbn/9782253088714-M.jpg","rating":5,"review":"Une longue nouvelle d’une redoutable efficacité . Difficile — au terme des quelques 260 pages de cette édition — si l’auteur nous reporte des propos réels ou s’il réifie une fiction issue d’un génie dynamique, percutant et unique. Une brève introspective, que chacun peut légitimement conduire sur   return { books: (window.SEED||[]).map(b => ({ id:uid(), review:'', tags:[], ...b })) };
}
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); return d&&d.books?d:null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('Sauvegarde impossible (mode privé ?)'); } }

/* ---------- Filtres ---------- */
const filters = { q:'', rayon:'all', tag:null, note:0, sort:'added', cw:132 };
const RAYONS = [
  { v:'all', l:'Tous' },
  { v:'currently-reading', l:'En cours' },
  { v:'to-read', l:'À lire' },
  { v:'read', l:'Lus' },
];
const SHELF_FR = { 'read':'Lus', 'to-read':'À lire', 'currently-reading':'En cours de lecture' };
const RAYON_COLOR = { 'read':'#cda54c', 'to-read':'#8a9a70', 'currently-reading':'#c98f52' };

/* ---------- Couvertures typographiques (secours façon poche) ---------- */
const BINDINGS = [
  { bg:'#e7dfcc', fg:'#22201a', ac:'#9c2b2b' },
  { bg:'#15140f', fg:'#d8b23a', ac:'#d8b23a' },
  { bg:'#1b2836', fg:'#e6ddc8', ac:'#c6a04a' },
  { bg:'#1e2b21', fg:'#e6ddc8', ac:'#b6873c' },
  { bg:'#371b21', fg:'#ecd9c4', ac:'#c6a04a' },
  { bg:'#2a2823', fg:'#e4dbc6', ac:'#8a9a70' },
];
function coverHTML(b, stars=true){
  const bd = BINDINGS[hash(b.title+(b.authors?.[0]||'')) % BINDINGS.length];
  const auth = (b.authors && b.authors[0]) || '';
  const fb = `<div class="fb" style="background:${bd.bg};color:${bd.fg}">
      <span class="fb-rule" style="background:${bd.ac}"></span>
      <span class="fb-auth">${esc(auth)}</span>
      <span class="fb-title">${esc(b.title)}</span>
      <span class="fb-col" style="border-color:${bd.ac}">${esc(b.publisher||'')}</span>
    </div>`;
  const src = b.cover ? b.cover + (b.cover.includes('openlibrary')?'?default=false':'') : '';
  const img = src ? `<img loading="lazy" decoding="async" src="${esc(src)}" alt="">` : '';
  const st = (stars && b.rating>0) ? `<div class="stars">${'★'.repeat(b.rating)}${'☆'.repeat(5-b.rating)}</div>` : '';
  const rd = b.shelf==='currently-reading' ? `<div class="reading">en cours</div>` : '';
  return `<div class="cover"><span class="spine"></span>${fb}${img}${st}${rd}</div>`;
}
// couvertures manquantes : révéler le secours (capture, sans handler inline)
document.body.addEventListener('error', e=>{ if(e.target.tagName==='IMG') e.target.classList.add('hide'); }, true);

/* ---------- Rendu galerie ---------- */
function matches(b){
  if(filters.rayon!=='all' && b.shelf!==filters.rayon) return false;
  if(filters.tag && !(b.tags||[]).includes(filters.tag)) return false;
  if(filters.note && (b.rating||0) < filters.note) return false;
  if(filters.q){
    const hay = (b.title+' '+(b.authors||[]).join(' ')).toLowerCase();
    if(!hay.includes(filters.q)) return false;
  }
  return true;
}
function sortBooks(arr){
  const s = filters.sort;
  const by = {
    added:  (a,b)=> (b.added||0)-(a.added||0),
    title:  (a,b)=> a.title.localeCompare(b.title,'fr'),
    author: (a,b)=> ((a.authors?.[0])||'').localeCompare((b.authors?.[0])||'','fr'),
    year:   (a,b)=> (parseInt(b.year)||0)-(parseInt(a.year)||0),
    rating: (a,b)=> (b.rating||0)-(a.rating||0) || a.title.localeCompare(b.title,'fr'),
  }[s];
  return arr.sort(by);
}
function bookNode(b){
  const el = document.createElement('div');
  el.className = 'book';
  el.innerHTML = coverHTML(b) + `<div class="cap"><div class="t">${esc(b.title)}</div><div class="a">${esc((b.authors||[]).join(', ')||'—')}</div></div>`;
  el.onclick = ()=> openFiche(b.id);
  return el;
}
function renderGallery(){
  const wrap = $('gallery');
  wrap.style.setProperty('--cw', filters.cw+'px');
  const list = sortBooks(state.books.filter(matches));
  wrap.innerHTML = '';
  if(!list.length){
    wrap.innerHTML = `<div class="empty-gal">Aucun livre ne correspond à ces filtres.<br>Ajustez la recherche ou les rayons.</div>`;
    return renderChips();
  }
  const grouped = filters.rayon==='all';
  if(grouped){
    for(const {v,l} of RAYONS.slice(1)){
      const g = list.filter(b=>b.shelf===v);
      if(!g.length) continue;
      const head = document.createElement('div');
      head.className='group-head';
      head.innerHTML = `<h2 class="serif">${l}</h2><span class="rule"></span><span class="n mono">${g.length}</span>`;
      wrap.appendChild(head);
      const grid = document.createElement('div'); grid.className='gallery';
      grid.style.setProperty('--cw', filters.cw+'px');
      g.forEach(b=>grid.appendChild(bookNode(b)));
      wrap.appendChild(grid);
    }
  } else {
    const grid = document.createElement('div'); grid.className='gallery';
    grid.style.setProperty('--cw', filters.cw+'px');
    list.forEach(b=>grid.appendChild(bookNode(b)));
    wrap.appendChild(grid);
  }
  renderChips();
}

/* ---------- Chips + insight ---------- */
function renderChips(){
  const rc = $('rayonChips'); rc.innerHTML='';
  for(const {v,l} of RAYONS){
    const n = v==='all' ? state.books.length : state.books.filter(b=>b.shelf===v).length;
    const c = document.createElement('button');
    c.className = 'chip'+(filters.rayon===v?' on':'');
    c.innerHTML = `${l}<span class="c">${n}</span>`;
    c.onclick = ()=>{ filters.rayon=v; renderGallery(); };
    rc.appendChild(c);
  }
  const tags = [...new Set(state.books.flatMap(b=>b.tags||[]))].sort();
  const tc = $('tagChips'); tc.innerHTML='';
  for(const t of tags){
    const c = document.createElement('button');
    c.className='chip'+(filters.tag===t?' on':'');
    c.textContent = '# '+t;
    c.onclick = ()=>{ filters.tag = filters.tag===t?null:t; renderGallery(); };
    tc.appendChild(c);
  }
}
function renderInsight(){
  const n = state.books.length;
  const rated = state.books.filter(b=>b.rating>0);
  const avg = rated.length ? (rated.reduce((s,b)=>s+b.rating,0)/rated.length) : 0;
  const counts = {}; state.books.forEach(b=> counts[b.shelf]=(counts[b.shelf]||0)+1 );
  const distro = ['currently-reading','to-read','read'].map(v=>{
    const w = n ? (counts[v]||0)/n*100 : 0;
    return `<span style="width:${w}%;background:${RAYON_COLOR[v]}" title="${SHELF_FR[v]} : ${counts[v]||0}"></span>`;
  }).join('');
  $('insight').innerHTML = `
    <div class="metric"><span class="n serif">${n}</span><span class="l">volumes</span></div>
    <div class="metric"><span class="n serif">${avg?avg.toFixed(2):'—'}<small>${avg?' ★':''}</small></span><span class="l">note moyenne</span></div>
    <div class="metric" style="gap:5px"><div class="distro">${distro}</div><span class="l">lus · à lire · en cours</span></div>`;
}

/* ---------- Fiche ---------- */
function openFiche(id){
  const b = state.books.find(x=>x.id===id); if(!b) return;
  const stars = [0,1,2,3,4].map(i=>`<span data-v="${i+1}" class="${i<(b.rating||0)?'on':''}">★</span>`).join('');
  const tags = (b.tags||[]).map(t=>`<span class="ftag">${esc(t)}</span>`).join('');
  const rayonOpts = ['currently-reading','to-read','read'].map(v=>`<option value="${v}" ${b.shelf===v?'selected':''}>${SHELF_FR[v]}</option>`).join('');
  $('fiche').innerHTML = `
    <div class="fiche-top">
      <button class="fiche-close" id="ficheClose">×</button>
      ${coverHTML(b, false)}
      <div class="head">
        <div class="k">Fiche de catalogue</div>
        <h2 class="serif">${esc(b.title)}</h2>
        <div class="by">${esc((b.authors||[]).join(', ')||'Auteur inconnu')}</div>
      </div>
    </div>
    <div class="fiche-body">
      <div class="rate" id="rate">${stars}</div>
      <div class="frow"><span class="lab">Éditeur</span><span class="val">${esc(b.publisher||'—')}</span></div>
      <div class="frow"><span class="lab">Année</span><span class="val">${esc(b.year||'—')}</span></div>
      <div class="frow"><span class="lab">Pages</span><span class="val">${b.pages?b.pages+' p.':'—'}</span></div>
      <div class="frow"><span class="lab">ISBN</span><span class="val">${esc(b.isbn||'—')}</span></div>
      ${b.review?`<div class="freview">${esc(b.review)}</div>`:''}
      ${tags?`<div class="ftags">${tags}</div>`:''}
    </div>
    <div class="fiche-foot">
      <label>Rayon</label>
      <select id="ficheShelf">${rayonOpts}</select>
      <button class="del" id="ficheDel" title="Retirer">🗑</button>
    </div>`;
  $('fiche').classList.add('show'); $('scrim').classList.add('show');
  $('ficheClose').onclick = closeFiche;
  $('rate').querySelectorAll('span').forEach(s=>{
    s.onclick = ()=>{ const v=+s.dataset.v; b.rating = (b.rating===v)?0:v; save(); openFiche(id); renderGallery(); renderInsight(); };
  });
  $('ficheShelf').onchange = e=>{ b.shelf=e.target.value; save(); renderGallery(); renderInsight(); openFiche(id); };
  $('ficheDel').onclick = ()=>{ if(confirm('Retirer « '+b.title+' » ?')){ state.books=state.books.filter(x=>x.id!==id); save(); closeFiche(); renderGallery(); renderInsight(); } };
}
function closeFiche(){ $('fiche').classList.remove('show'); $('scrim').classList.remove('show'); }
$('scrim').onclick = closeFiche;
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeFiche(); $('scanOverlay').classList.remove('show'); $('confirmOverlay').classList.remove('show'); stopScan(); } });

/* ---------- Barre d'outils ---------- */
$('search').addEventListener('input', e=>{ filters.q=e.target.value.trim().toLowerCase(); renderGallery(); });
$('noteFilter').onchange = e=>{ filters.note=+e.target.value; renderGallery(); };
$('sortBy').onchange = e=>{ filters.sort=e.target.value; renderGallery(); };
$('density').querySelectorAll('button').forEach(btn=>{
  btn.onclick = ()=>{ filters.cw=+btn.dataset.cw; $('density').querySelectorAll('button').forEach(x=>x.classList.remove('on')); btn.classList.add('on'); renderGallery(); };
});

/* ---------- Menu fichier ---------- */
$('menuBtn').onclick = e=>{ e.stopPropagation(); $('menuPop').classList.toggle('show'); };
document.addEventListener('click', ()=> $('menuPop').classList.remove('show'));
$('menuPop').onclick = e=> e.stopPropagation();

/* ---------- Recherche ISBN (Open Library → Google Books) ---------- */
async function lookupISBN(isbn){
  isbn = cleanISBN(isbn);
  try {
    const r = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
    const j = await r.json(); const d = j['ISBN:'+isbn];
    if(d) return { isbn, title:d.title||'Sans titre', authors:(d.authors||[]).map(a=>a.name),
      publisher:(d.publishers||[]).map(p=>p.name).join(', '), year:(d.publish_date||'').match(/\d{4}/)?.[0]||'',
      pages:d.number_of_pages||0, cover:d.cover?.medium||`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg`, review:'', tags:[] };
  } catch(e){}
  try {
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
    const j = await r.json();
    if(j.totalItems>0){ const v=j.items[0].volumeInfo;
      return { isbn, title:v.title+(v.subtitle?' — '+v.subtitle:''), authors:v.authors||[], publisher:v.publisher||'',
        year:(v.publishedDate||'').match(/\d{4}/)?.[0]||'', pages:v.pageCount||0,
        cover:v.imageLinks?.thumbnail?.replace('http:','https:')||`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg`, review:'', tags:[] }; }
  } catch(e){}
  return null;
}

/* ---------- Scan caméra ---------- */
let html5Qr=null, lastScan=0;
$('openScan').onclick = startScan;
$('closeScan').onclick = ()=>{ $('scanOverlay').classList.remove('show'); stopScan(); };
$('scanOverlay').onclick = e=>{ if(e.target.id==='scanOverlay'){ $('scanOverlay').classList.remove('show'); stopScan(); } };
async function startScan(){
  $('scanOverlay').classList.add('show');
  const note=$('scanNote'); note.className='sheet-note'; note.textContent='Démarrage de la caméra…';
  if(typeof Html5Qrcode==='undefined'){ note.className='sheet-note err'; note.textContent="Module caméra indisponible (connexion ?). Saisissez l'ISBN via « Ajouter un livre » plus tard."; return; }
  try{
    html5Qr = new Html5Qrcode('reader', { formatsToSupport:[ Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8 ] });
    await html5Qr.start({ facingMode:'environment' }, { fps:10, qrbox:{width:260,height:150} }, onScan, ()=>{});
    note.textContent='Cadrez le code-barres au dos du livre.';
  }catch(err){ note.className='sheet-note err'; note.textContent='Caméra indisponible ('+(err?.message||err)+').'; }
}
async function stopScan(){ if(html5Qr){ try{ await html5Qr.stop(); html5Qr.clear(); }catch(e){} html5Qr=null; } }
async function onScan(text){
  const now=Date.now(); if(now-lastScan<1500) return; lastScan=now;
  const isbn=cleanISBN(text); if(!/^(97[89]\d{10}|\d{9}[0-9X])$/.test(isbn)) return;
  if(navigator.vibrate) navigator.vibrate(40);
  $('scanOverlay').classList.remove('show'); await stopScan();
  handleISBN(isbn);
}

/* ---------- Ajout via ISBN + confirmation ---------- */
async function handleISBN(raw){
  const isbn=cleanISBN(raw);
  const ex=state.books.find(b=>b.isbn===isbn);
  if(ex){ toast('Déjà au catalogue.'); openFiche(ex.id); return; }
  openConfirm(null, isbn, true);
  const data = await lookupISBN(isbn);
  openConfirm(data, isbn, false);
}
$('closeConfirm').onclick = ()=> $('confirmOverlay').classList.remove('show');
$('confirmOverlay').onclick = e=>{ if(e.target.id==='confirmOverlay') $('confirmOverlay').classList.remove('show'); };
function rayonSelect(id, val='to-read'){ return `<select id="${id}">${['to-read','currently-reading','read'].map(v=>`<option value="${v}" ${v===val?'selected':''}>${SHELF_FR[v]}</option>`).join('')}</select>`; }
function openConfirm(data, isbn, loading){
  const body=$('confirmBody'); $('confirmOverlay').classList.add('show');
  if(loading){ body.innerHTML=`<div class="sheet-note"><span class="spinner"></span>Recherche de « ${esc(isbn)} »…</div>`; return; }
  if(!data){
    body.innerHTML = `
      <div class="sheet-note err">Aucune fiche trouvée pour ${esc(isbn)}.</div>
      <label>Titre</label><input id="mT" placeholder="Titre du livre">
      <label>Auteur</label><input id="mA" placeholder="Auteur">
      <label>Rayon</label>${rayonSelect('mS')}
      <div class="acts"><button id="cCancel">Annuler</button><button class="ok" id="cAdd">Ajouter</button></div>`;
    $('cCancel').onclick=()=> $('confirmOverlay').classList.remove('show');
    $('cAdd').onclick=()=>{ const t=$('mT').value.trim(); if(!t) return toast('Indiquez un titre.');
      addBook({ isbn, title:t, authors:$('mA').value?[$('mA').value]:[], publisher:'', year:'', pages:0, cover:isbn?`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg`:'', review:'', tags:[] }, $('mS').value); };
    return;
  }
  body.innerHTML = `
    <div class="head">${coverHTML({...data, rating:0, shelf:''}, false)}
      <div><div class="t serif">${esc(data.title)}</div><div class="a">${esc(data.authors.join(', ')||'Auteur inconnu')}</div>
      <div class="isbn">ISBN ${esc(isbn)}${data.year?' · '+data.year:''}${data.pages?' · '+data.pages+' p.':''}</div></div>
    </div>
    <label>Rayon</label>${rayonSelect('cS')}
    <div class="acts"><button id="cCancel">Annuler</button><button class="ok" id="cAdd">Ajouter au catalogue</button></div>`;
  $('cCancel').onclick=()=> $('confirmOverlay').classList.remove('show');
  $('cAdd').onclick=()=> addBook(data, $('cS').value);
}
function addBook(data, shelf){
  const b={ id:uid(), rating:0, tags:[], review:'', ...data, shelf, added:Date.now() };
  state.books.push(b); save();
  $('confirmOverlay').classList.remove('show');
  renderGallery(); renderInsight(); openFiche(b.id);
  toast('« '+b.title.slice(0,40)+' » ajouté.');
}

/* ---------- Import / Export ---------- */
function download(text,name,mime){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function fmtDate(ts){ if(!ts) return ''; const d=new Date(ts); return isNaN(d)?'':`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; }

$('exportJson').onclick=()=>{ download(JSON.stringify(state,null,2),'cabinet-de-lecture.json','application/json'); toast('Exporté (.json).'); };
$('exportCsv').onclick=()=>{
  const cols=['Title','Author','ISBN','ISBN13','My Rating','Publisher','Number of Pages','Year Published','Date Added','Bookshelves','Exclusive Shelf','My Review'];
  const q=v=>{ v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const gr=i=> i?'="'+i+'"':'';
  const lines=[cols.join(',')];
  for(const b of state.books){
    const i13=(b.isbn||'').length===13?b.isbn:'', i10=(b.isbn||'').length===10?b.isbn:'';
    lines.push([q(b.title),q((b.authors||[])[0]||''),q(gr(i10)),q(gr(i13)),q(b.rating||0),q(b.publisher),q(b.pages||''),q(b.year),q(fmtDate(b.added)),q((b.tags||[]).join(', ')),q(b.shelf||'to-read'),q(b.review||'')].join(','));
  }
  download('\ufeff'+lines.join('\n'),'cabinet-de-lecture-goodreads.csv','text/csv;charset=utf-8'); toast('Exporté (.csv Goodreads).');
};
$('resetSeed').onclick=()=>{ if(confirm('Remplacer le catalogue courant par la bibliothèque d’exemple (441 livres) ?')){ state=seed(); save(); closeFiche(); renderAll(); toast('Bibliothèque d’exemple rechargée.'); } };

$('importBtn').onclick=()=> $('importFile').click();
$('importFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>routeImport(rd.result,f.name); rd.readAsText(f); e.target.value=''; };

function parseCSV(text){
  text=text.replace(/^\ufeff/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows=[]; let row=[],f='',q=false,i=0;
  while(i<text.length){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false;i++;continue;} f+=c;i++;continue; }
    if(c==='"'){q=true;i++;continue;} if(c===','){row.push(f);f='';i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue;} f+=c;i++;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); } return rows;
}
function mapGoodreads(rows){
  const head=rows[0].map(h=>h.trim()); const ix=n=>head.indexOf(n);
  const I={t:ix('Title'),a:ix('Author'),ad:ix('Additional Authors'),i:ix('ISBN'),i13:ix('ISBN13'),r:ix('My Rating'),p:ix('Publisher'),pg:ix('Number of Pages'),y:ix('Year Published'),oy:ix('Original Publication Year'),d:ix('Date Added'),sh:ix('Bookshelves'),ex:ix('Exclusive Shelf'),rv:ix('My Review')};
  const EX={'read':1,'to-read':1,'currently-reading':1}; const out=[];
  for(let r=1;r<rows.length;r++){ const c=rows[r]; if(!c||!(c[I.t]||'').trim()) continue;
    const isbn=cleanISBN(c[I.i13])||cleanISBN(c[I.i])||'';
    out.push({ isbn, title:(c[I.t]||'').trim(),
      authors:[(c[I.a]||'').trim(),...String(c[I.ad]||'').split(',').map(s=>s.trim())].filter(Boolean),
      publisher:(c[I.p]||'').trim(), year:(c[I.y]||'').trim()||(c[I.oy]||'').trim(),
      pages:parseInt(c[I.pg])||0, cover:isbn?`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg`:'',
      rating:Math.round(parseFloat(c[I.r])||0)||0, review:(c[I.rv]||'').trim(),
      shelf:(c[I.ex]||'to-read').trim(),
      tags:String(c[I.sh]||'').split(',').map(s=>s.trim()).filter(s=>s&&!EX[s]),
      added:Date.parse((c[I.d]||'').replace(/\//g,'-'))||Date.now() });
  }
  return out;
}
function routeImport(text,name){
  const isCsv=/\.csv$/i.test(name)||(!text.trim().startsWith('{')&&/(^|\n)"?(Book Id|Title),/.test(text));
  if(isCsv){
    let rows; try{ rows=parseCSV(text); }catch(e){ return toast('CSV illisible.'); }
    const books=mapGoodreads(rows); if(!books.length) return toast('Aucun livre dans ce CSV.');
    const haveI=new Set(state.books.filter(b=>b.isbn).map(b=>b.isbn));
    const haveK=new Set(state.books.map(b=>(b.title+'|'+(b.authors?.[0]||'')).toLowerCase()));
    const fresh=books.filter(b=> b.isbn?!haveI.has(b.isbn):!haveK.has((b.title+'|'+(b.authors?.[0]||'')).toLowerCase()));
    fresh.forEach(b=> b.id=uid());
    state.books.push(...fresh); save(); closeFiche(); renderAll();
    toast(`${fresh.length} livre${fresh.length>1?'s':''} importé${fresh.length>1?'s':''}${books.length-fresh.length?`, ${books.length-fresh.length} doublon(s) ignoré(s)`:''}.`);
  } else {
    try{ const d=JSON.parse(text); if(!d.books) throw 0; state=d; state.books.forEach(b=>{ if(!b.id) b.id=uid(); }); save(); closeFiche(); renderAll(); toast('Catalogue importé.'); }
    catch(e){ toast('Fichier .json invalide.'); }
  }
}

/* ---------- Toast + boot ---------- */
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function renderAll(){ renderInsight(); renderGallery(); }
renderAll();
